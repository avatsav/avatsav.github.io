<div class="dock lit-surface">
  <a href="{{ "" | relURL }}" class="title">
    <!-- prettier-ignore -->
    <h2><span class="prompt" aria-hidden="true">&gt;</span>{{ .Site.Title }}<span class="cursor" aria-hidden="true">█</span></h2>
  </a>
  <nav id="site-nav">{{- partial "nav.html" . -}}</nav>
  <button
    class="nav-toggle"
    type="button"
    aria-expanded="false"
    aria-controls="site-nav"
    aria-label="Toggle navigation"
  >
    <svg
      class="nav-toggle-icon"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="currentColor"
      aria-hidden="true"
    >
      <path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z" />
    </svg>
  </button>
</div>
