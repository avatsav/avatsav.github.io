<p>© Abhi 2026</p>
<p>
  {{ with .Site.Params.version }}<span class="version">v{{ . }}</span>{{ end }}
  {{ with .GitInfo }}
    |
    <a
      class="commit-hash"
      href="https://github.com/avatsav/avatsav.github.io/commit/{{ .Hash }}"
      title="{{ .Subject }}"
      >{{ .AbbreviatedHash }}</a
    >
  {{ end }}
</p>
