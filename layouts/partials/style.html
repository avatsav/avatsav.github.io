{{- $bg := "#0f1117" -}} {{- $text := "#c9cdd8" -}} {{- $link := "#8c9dd4" -}}
<style>
  /* ===== Self-hosted Fonts ===== */
  /* Inter — rsms.me/inter defaults */
  @font-face {
    font-family: InterVariable;
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url("/fonts/InterVariable.woff2") format("woff2");
  }

  @font-feature-values InterVariable {
    @character-variant {
      cv01: 1; cv02: 2; cv03: 3; cv04: 4; cv05: 5; cv06: 6; cv07: 7; cv08: 8;
      cv09: 9; cv10: 10; cv11: 11; cv12: 12; cv13: 13;
      alt-1: 1;            /* Alternate one */
      alt-3: 9;            /* Flat-top three */
      open-4: 2;           /* Open four */
      open-6: 3;           /* Open six */
      open-9: 4;           /* Open nine */
      lc-l-with-tail: 5;   /* Lower-case L with tail */
      simplified-u: 6;     /* Simplified u */
      alt-double-s: 7;     /* Alternate German double s */
      uc-i-with-serif: 8;  /* Upper-case i with serif */
      uc-g-with-spur: 10;  /* Capital G with spur */
      single-story-a: 11;  /* Single-story a */
      compact-lc-f: 12;    /* Compact f */
      compact-lc-t: 13;    /* Compact t */
    }
    @styleset {
      ss01: 1; ss02: 2; ss03: 3; ss04: 4; ss05: 5; ss06: 6; ss07: 7; ss08: 8;
      open-digits: 1;                /* Open digits */
      disambiguation: 2;             /* Disambiguation (with zero) */
      disambiguation-except-zero: 4; /* Disambiguation (no zero) */
      round-quotes-and-commas: 3;    /* Round quotes & commas */
      square-punctuation: 7;         /* Square punctuation */
      square-quotes: 8;              /* Square quotes */
      circled-characters: 5;         /* Circled characters */
      squared-characters: 6;         /* Squared characters */
    }
  }

  @font-face {
    font-family: "JetBrains Mono";
    font-style: normal;
    font-weight: 400 600;
    font-display: swap;
    src: url("/fonts/JetBrainsMono-latin.woff2") format("woff2");
    unicode-range:
      U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
      U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
      U+2212, U+2215, U+FEFF, U+FFFD;
  }

  /* ===== CSS Variables ===== */
  :root {
    /* Layout */
    --width: 720px;
    --space: 1.5rem;
    --radius: 5px;

    /* Typography */
    --font-main: Inter, sans-serif;
    --font-mono: "JetBrains Mono", monospace;
    --font-scale: 1.04em;
    --font-small: 0.9rem;
    --font-label: 0.75rem;

    /* Base Palette */
    color-scheme: dark;
    --bg-color: {{ $bg }};
    --text-color: {{ $text }};
    --link-color: {{ $link }};

    /* Computed Colors */
    --surface-color: color-mix(in oklch, var(--link-color) 15%, transparent);
    --muted-text-color: color-mix(
      in oklch,
      var(--text-color) 50%,
      var(--bg-color)
    );
    --border: color-mix(in oklch, var(--bg-color) 82%, var(--text-color));
    --code-bg: color-mix(in oklch, var(--link-color) 12%, var(--bg-color));
  }

  /* Use InterVariable for the primary sans stack when supported */
  @supports (font-variation-settings: normal) {
    :root {
      --font-main: InterVariable, sans-serif;
    }
  }

  /* ===== Base Styles ===== */

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html {
    background: var(--bg-color);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  @media (prefers-reduced-motion: no-preference) {
    html {
      scroll-behavior: smooth;
    }
  }

  body {
    font-family: var(--font-main), sans-serif;
    font-size: var(--font-scale);
    line-height: 1.6;
    color: var(--text-color);
    margin: auto;
    padding-inline: 20px;
    padding-block: 0 20px;
    max-width: var(--width);
    text-align: left;
    word-wrap: break-word;
    overflow-wrap: break-word;
    text-rendering: optimizeLegibility;
  }

  main {
    line-height: 1.6;
    padding-block-start: 3rem;
  }

  /* ===== Typography ===== */
  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-family: var(--font-mono);
    font-synthesis: none;
    color: var(--text-color);
    margin-block: 2rem 0.75rem;
    letter-spacing: 0;
    line-height: 1.3;
    font-weight: 600;
    text-wrap: balance;
    page-break-after: avoid;
  }

  h1 {
    font-size: clamp(1.8rem, 4vw, 2rem);
    text-transform: uppercase;
    line-height: 1.15;
  }

  h2 {
    font-size: 1.5rem;
    text-transform: uppercase;
  }

  h3 {
    font-size: 1.15rem;
  }

  h4 {
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  p {
    margin-block: var(--space);
  }

  h1 + p {
    margin-block: 0 var(--space);
  }

  .markdown-content :is(p, li, blockquote, figcaption, td, th, dd) {
    font-family: var(--font-main);
    line-height: 1.7;
    text-wrap: pretty;
  }

  strong,
  b {
    color: var(--text-color);
    font-weight: 600;
  }

  time {
    font-family: var(--font-mono);
    font-style: normal;
    font-size: var(--font-label);
    color: var(--muted-text-color);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ===== Links ===== */
  a {
    color: var(--link-color);
    cursor: pointer;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  nav {
    font-family: var(--font-mono);
    font-size: var(--font-label);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  nav a {
    margin-right: 8px;
    color: var(--muted-text-color);
  }

  nav a:hover {
    color: var(--text-color);
  }

  .nav-toggle {
    display: none;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted-text-color);
    padding: 6px 12px;
    font-family: var(--font-mono);
    font-size: var(--font-label);
    letter-spacing: 0.05em;
    cursor: pointer;
  }

  .nav-toggle:hover {
    color: var(--text-color);
    border-color: var(--text-color);
  }

  /* ===== Header Layout ===== */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    min-height: 56px;
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg-color);
  }

  header::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 100vw;
    height: 1px;
    background: var(--border);
    transform: translateX(-50%);
  }

  header:has(nav.is-open)::after {
    display: none;
  }

  @media (max-width: 600px) {
    .nav-toggle {
      display: inline-block;
    }

    header nav {
      display: none;
    }

    header nav.is-open {
      display: flex;
      position: absolute;
      top: 100%;
      left: 50%;
      width: 100vw;
      transform: translateX(-50%);
      background: var(--bg-color);
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      border-block-end: 1px solid var(--border);
    }

    header nav a {
      margin-right: 0;
      padding: 0.75rem 0;
      text-align: center;
    }
  }

  /* ===== Lists ===== */
  ul,
  ol {
    margin-block: var(--space);
    padding-inline-start: 1.6rem;
  }

  li + li {
    margin-block-start: 0.25rem;
  }

  li > ul,
  li > ol {
    margin-block: 0.25rem;
    margin-inline: 0;
  }

  /* ===== Blockquotes ===== */
  blockquote {
    margin-block: calc(var(--space) * 1.25);
    margin-inline: 0;
    padding: 0.9rem 1.2rem;
    background: var(--surface-color);
    border-inline-start: 3px solid var(--link-color);
    border-radius: 0 var(--radius) var(--radius) 0;
    color: var(--text-color);
  }

  blockquote > *:first-child {
    margin-block-start: 0;
  }

  blockquote > *:last-child {
    margin-block-end: 0;
  }

  blockquote cite {
    display: block;
    margin-block-start: 0.6rem;
    font-style: normal;
    font-size: var(--font-small);
    color: color-mix(in oklch, var(--muted-text-color) 70%, var(--text-color));
  }

  blockquote cite::before {
    content: "— ";
  }

  /* ===== Code ===== */
  code,
  pre {
    font-family: var(--font-mono);
    font-size: 0.875em;
  }

  :not(pre) > code {
    padding: 2px 4px;
    border-radius: var(--radius);
    background: var(--code-bg);
  }

  .highlight pre {
    padding: 1rem 0;
    border-radius: var(--radius);
    display: block;
    overflow-x: auto;
  }

  .highlight pre code {
    display: inline-block;
    min-width: 100%;
  }

  mark {
    background: rgba(255, 150, 120, 0.4);
    padding: 1px 3px;
    transform: skewX(-3deg);
    display: inline-block;
  }

  kbd {
    font-family: var(--font-mono);
    font-feature-settings: normal;
    background: var(--surface-color);
    padding: 2px 6px;
    margin: 0 2px;
    font-size: calc(var(--font-scale) * 0.95);
    border: 1px solid var(--link-color);
    border-radius: 4px;
    display: inline-block;
    transform: perspective(200px) rotateX(12deg);
    box-shadow:
      0 3px 0 var(--link-color),
      0 4px 4px rgba(0, 0, 0, 0.3);
  }

  /* ===== Media ===== */
  img {
    max-width: 100%;
    height: auto;
    border-radius: var(--radius);
  }

  figure {
    margin: var(--space) 0;
  }

  figure img {
    display: block;
  }

  figcaption {
    text-align: center;
    font-size: var(--font-small);
    color: var(--muted-text-color);
    font-style: italic;
    margin-block-start: 0.75rem;
  }

  figcaption p {
    margin: 1rem;
  }

  table {
    width: 100%;
  }

  hr {
    margin-block: calc(var(--space) * 1.5);
    margin-inline: 0;
    border: none;
    border-block-start: 1px solid var(--border);
  }

  /* ===== Interactive Elements ===== */
  button {
    margin: 0;
    cursor: pointer;
  }

  :focus-visible {
    outline: 2px solid var(--link-color);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    mark {
      transform: none;
    }

    kbd {
      transform: none;
    }
  }

  /* ===== Layout Components ===== */
  .title:hover {
    text-decoration: none;
  }

  .title h2 {
    margin: 0;
    font-family: var(--font-mono);
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .post-navigator {
    display: flex;
    gap: 1rem;
    justify-content: center;
    font-size: var(--font-small);
  }

  footer {
    margin-block-start: 4rem;
    text-align: center;
    font-family: var(--font-mono);
    font-size: var(--font-label);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted-text-color);
  }

  footer p {
    margin-block: 0.5rem;
  }

  footer a {
    color: var(--muted-text-color);
  }

  footer a:hover {
    color: var(--text-color);
  }

  /* ===== Blog Post List ===== */
  ul.blog-posts {
    list-style-type: none;
    margin-block: var(--space) 2rem;
    margin-inline: 0;
    padding: 0;

    & li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      padding-block: 0.5rem;
      border-block-end: 1px solid var(--border);

      & a {
        color: var(--text-color);
        text-decoration: none;
        flex: 1 1 auto;
        font-family: var(--font-mono);
        font-size: var(--font-small);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      & a:visited {
        color: var(--text-color);
      }

      & a:hover {
        color: var(--link-color);
        text-decoration: none;
      }

      & time {
        flex: 0 0 auto;
        white-space: nowrap;
      }
    }
  }

  /* ===== Tags List ===== */
  .tags-list {
    margin-block-start: 2rem;
    font-family: var(--font-mono);
    font-size: var(--font-label);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .tags-list a {
    color: var(--muted-text-color);
  }

  .tags-list a:hover {
    color: var(--link-color);
  }

  /* ===== Table of Contents ===== */
  .toc {
    margin-block: var(--space);
    padding: 1rem;
    background: var(--surface-color);
    border-radius: var(--radius);
    font-size: var(--font-small);

    & summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--text-color);

      &:hover {
        color: var(--link-color);
      }
    }

    & #TableOfContents {
      margin-block-start: 0.75rem;

      & ul {
        margin-block: 0;
        padding-inline-start: 1.2rem;
        list-style: none;
      }

      & > ul {
        padding-inline-start: 0;
      }

      & li {
        margin-block: 0.25rem;
      }

      & a {
        color: var(--text-color);
        text-decoration: none;

        &:hover {
          color: var(--link-color);
          text-decoration: underline;
        }
      }
    }
  }
</style>
